[package]
name = "synapse-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Identity
ed25519-dalek = "3.0"
sha2 = "0.10"

# DHT
libp2p = { version = "0.56", features = ["kad", "noise", "yamux", "tcp", "quic", "macros"] }
tokio = { version = "1", features = ["full"] }

# Gateway (HTTP)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "auth"] }
tracing-subscriber = "0.3"

# Serialization
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Domain
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
chrono = "0.4"

# Web3 — alloy replaces deprecated ethers-rs
alloy = { version = "2", features = ["full"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lib]
name = "synapse_core"
path = "src/lib.rs"

[[bin]]
name = "synapse-node"
path = "src/main.rs"
