[package]
name = "synapse-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Identity
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"

# DHT
libp2p = { version = "0.55", features = ["kad", "noise", "yamux", "tcp", "quic", "macros"] }
tokio = { version = "1", features = ["full"] }

# Serialization
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Domain
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
chrono = "0.4"

# Web3
ethers = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lib]
name = "synapse_core"
path = "src/lib.rs"
