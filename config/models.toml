# Synapse Curated Model Catalog
#
# Models are manually verified before listing.
# Community proposals via GitHub PR welcome.
#
# Each model entry requires:
#   id          — unique model identifier (kebab-case)
#   hf_repo     — HuggingFace repository
#   sha256      — verified SHA256 of the full model checkpoint
#   experts     — total experts in the MoE architecture
#   active_per_token — how many experts activate per forward pass
#   expert_size_gb — per-expert VRAM in 4-bit quantization
#   shared_params_gb — shared parameters (embeddings, attention, gate)
#   context     — maximum context window in tokens

