name: Bug Report
description: Report a bug in Synapse
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in the details below so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. cargo run --release
        2. curl -X POST http://localhost:8000/v1/jobs ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Run these commands and paste the output:
        - `rustc --version`
        - `python --version` (if applicable)
        - `uname -a`
      render: shell
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Synapse is affected?
      options:
        - Gateway (axum HTTP)
        - Scheduler
        - Worker / Inference Runtime
        - Native MoE Runtime
        - Model Catalog
        - Smart Contracts
        - Build / CI
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant log output. This will be automatically formatted.
      render: shell
